*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

h1{font:800 clamp(2rem,6vw,3rem)/1.05 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 24px;max-width:52ch}
.search{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:14px 16px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.go{font:inherit;font-weight:600;padding:0 22px;border:0;border-radius:12px;background:var(--ac);color:var(--acfg);cursor:pointer}
.try{margin:12px 0 0;color:var(--mut);font-size:.9rem}
.try button{font:inherit;color:var(--ac);background:none;border:0;padding:2px 6px;cursor:pointer;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 8px}
.chip{font:inherit;font-size:.92rem;padding:7px 14px;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.note{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:12px 16px;color:var(--mut);font-size:.92rem;margin:16px 0}
h2{font:600 1.15rem "Bricolage Grotesque",system-ui,sans-serif;margin:24px 0 4px}
.item{display:grid;grid-template-columns:6px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px 16px 0;margin-top:12px;overflow:hidden}
.bar{background:var(--k);margin:-16px 0 -16px 0}
.item h3{margin:0;font-size:1.05rem}
.tag{display:inline-block;font-size:.8rem;font-weight:600;color:var(--k);margin-bottom:2px}
.hot{font-size:.75rem;font-weight:600;color:var(--k);border:1.5px solid var(--k);border-radius:999px;padding:0 8px;margin-left:8px}
.item p{margin:4px 0 12px;color:var(--mut);font-size:.95rem}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:.88rem;font-weight:600;text-decoration:none;padding:7px 12px;border-radius:8px;border:1.5px solid var(--line);color:var(--fg)}
.links a.v{background:var(--k);border-color:var(--k);color:#fff}
.empty{color:var(--mut);padding:24px 0}
@media (max-width:480px){.go{padding:0 16px}}
</style>

Object.keys(MORE).forEach(k=>Object.keys(MORE[k]).forEach(c=>{DATA[k][c]=(DATA[k][c]||[]).concat(MORE[k][c])}));
const ALIAS={jogja:"Yogyakarta",yogya:"Yogyakarta",jogjakarta:"Yogyakarta",ubud:"Bali",kuta:"Bali",seminyak:"Bali",denpasar:"Bali",dki:"Jakarta",sby:"Surabaya",batu:"Malang",smg:"Semarang","ujung pandang":"Makassar",mataram:"Lombok",senggigi:"Lombok",gili:"Lombok"};
const tt=q=>"https://www.tiktok.com/search?q="+encodeURIComponent(q);
const mp=q=>"https://www.google.com/maps/search/"+encodeURIComponent(q);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
let region="",key=null,cat="semua";

$("kota").innerHTML=Object.keys(DATA).map(k=>'<option value="'+k+'">').join("");
$("try").innerHTML='Coba: '+Object.keys(DATA).map(k=>'<button data-k="'+k+'">'+k+'</button>').join("");

function find(q){
  const n=q.toLowerCase().trim();
  if(ALIAS[n])return ALIAS[n];
  return Object.keys(DATA).find(k=>k.toLowerCase()===n||k.toLowerCase().includes(n)||n.includes(k.toLowerCase()))||null;
}
function search(){
  const q=$("q").value.trim();
  if(!q)return;
  key=find(q);
  region=key||q.replace(/\b\w/g,c=>c.toUpperCase());
  cat="semua";
  render();
}
function items(){
  const list=[];
  Object.keys(CATS).forEach(c=>{
    if(cat!=="semua"&&cat!==c)return;
    if(key){
      (DATA[key][c]||[]).forEach(([n,d,v,h])=>list.push({c,n,d,h,v:v||tt(n+" "+key),m:mp(n+" "+key)}));
    }else{
      const l=CATS[c].toLowerCase();
      list.push({c,n:CATS[c]+" di "+region,d:"Belum ada data pilihan untuk daerah ini. Buka hasil pencarian video dan peta untuk melihat rekomendasi.",v:tt("rekomendasi "+l+" di "+region),m:mp(l+" di "+region)});
    }
  });
  return list;
}
function render(){
  const chips=[["semua","Semua"]].concat(Object.entries(CATS).filter(([k])=>!key||DATA[key][k])).map(([k,l])=>'<button class="chip" data-c="'+k+'" aria-pressed="'+(cat===k)+'">'+l+'</button>').join("");
  const note=key?'':'<div class="note">Data pilihan untuk <b>'+esc(region)+'</b> belum tersedia. Tautan di bawah membuka pencarian video dan peta untuk daerah itu.</div>';
  const cards=items().map(i=>'<div class="item" style="--k:var(--c-'+i.c+')"><div class="bar"></div><div><span class="tag">'+CATS[i.c]+'</span>'+(i.h?'<span class="hot">'+(i.h==2?'Selalu ramai':'Lagi hits')+'</span>':'')+'<h3>'+esc(i.n)+'</h3><p>'+esc(i.d)+'</p><div class="links"><a class="v" href="'+i.v+'" target="_blank" rel="noopener noreferrer">Tonton di TikTok</a><a href="'+i.m+'" target="_blank" rel="noopener noreferrer">Lihat di peta</a></div></div></div>').join("");
  $("out").innerHTML='<h2>Rekomendasi di '+esc(region)+'</h2><div class="chips">'+chips+'</div>'+note+cards;
}
$("go").onclick=search;
$("q").addEventListener("keydown",e=>{if(e.key==="Enter")search()});
$("try").addEventListener("click",e=>{const k=e.target.dataset.k;if(k){$("q").value=k;search()}});
$("out").addEventListener("click",e=>{const c=e.target.dataset.c;if(c){cat=c;render()}});
</script>
